name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm --dir example exec tsc --noEmit
      - run: pnpm --dir example exec expo prebuild --platform android --clean --no-install
      - run: example/android/gradlew -p example/android :motion-event:compileDebugKotlin --no-daemon -PreactNativeArchitectures=arm64-v8a
