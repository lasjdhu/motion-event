name: Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package
        run: pnpm validate

      - name: Check example types
        run: pnpm --dir example exec tsc --noEmit

      - name: Generate example Android project
        run: pnpm --dir example exec expo prebuild --platform android --clean --no-install

      - name: Compile native module
        working-directory: example/android
        run: ./gradlew :motion-event:compileDebugKotlin --no-daemon -PreactNativeArchitectures=arm64-v8a
